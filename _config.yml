# Jekyll configuration for GitHub Pages
title: Swaroop Gadiyaram
description: Applied AI/ML Lead - Building intelligent systems at the intersection of AI, Machine Learning, and Finance
author: Swaroop Gadiyaram
email: swaroop.g7@gmail.com

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Collections for blog posts
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Default front matter
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
